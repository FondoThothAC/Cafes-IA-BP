<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIA - Pivote o Persevera</title>
    <link rel="stylesheet" href="css/plania-core.css?v=3">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --pivot: #f59e0b;
            --persevere: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--pivot), var(--persevere));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .strategy-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--surface-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--surface-light);
            padding-bottom: 0.5rem;
        }

        .runway-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .checklist-item {
            display: flex;
            align-items: start;
            gap: 1rem;
            margin-bottom: 1rem;
            background: var(--surface-light);
            padding: 1rem;
            border-radius: 8px;
        }

        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 4px;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--surface-light);
            padding: 1rem;
            border-radius: 8px;
            color: white;
            font-family: inherit;
            margin-bottom: 1rem;
        }

        .decision-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .btn-decision {
            padding: 1.5rem;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-pivot {
            background: rgba(245, 158, 11, 0.1);
            color: var(--pivot);
            border-color: var(--pivot);
        }

        .btn-pivot:hover {
            background: var(--pivot);
            color: white;
        }

        .btn-persevere {
            background: rgba(16, 185, 129, 0.1);
            color: var(--persevere);
            border-color: var(--persevere);
        }

        .btn-persevere:hover {
            background: var(--persevere);
            color: white;
        }

        .btn-ai {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        #ai-advice-box {
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid #6366f1;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: none;
        }
    </style>
</head>

<body>
    <div id="plania-navbar"></div>

    <div class="container">
        <header>
            <h1>⚖️ Pivote o Persevera</h1>
            <p style="color: var(--text-muted);">Decisión estratégica basada en aprendizaje validado.</p>
        </header>

        <!-- Runway Status -->
        <div class="strategy-card">
            <div class="section-title">💸 Pista de Aterrizaje (Runway)</div>
            <div class="runway-display">
                <div>
                    <div style="font-size:0.9rem; color:var(--text-muted);">Burn Rate Mensual</div>
                    <input type="number" id="in-burn" value="50000"
                        style="background:transparent; border:none; color:white; font-size:1.2rem; width:100px;">
                </div>
                <div>
                    <div style="font-size:0.9rem; color:var(--text-muted);">Cash en Banco</div>
                    <input type="number" id="in-cash" value="300000"
                        style="background:transparent; border:none; color:white; font-size:1.2rem; width:100px;">
                </div>
                <div style="text-align:right;">
                    <div style="font-size:2.5rem; font-weight:700;" id="months-left">0</div>
                    <div style="font-size:0.8rem; color:var(--text-muted);">Meses de Vida</div>
                </div>
            </div>
            <p style="font-size:0.9rem; color:var(--pivot);" id="runway-alert"></p>
        </div>

        <!-- Learning Review -->
        <div class="strategy-card">
            <div class="section-title">🧠 Aprendizajes Recientes</div>
            <textarea id="learnings" rows="4"
                placeholder="¿Qué hemos aprendido de los experimentos recientes? (Ej. Los clientes no pagan por la funcionalidad X)"></textarea>

            <button class="btn-ai" onclick="consultAI()">
                🤖 Consultar Asesor Estratégico
            </button>

            <div id="ai-advice-box">
                <h3 style="margin-top:0; color:#a855f7;">Consejo del Asesor:</h3>
                <div id="ai-content"></div>
            </div>
        </div>

        <!-- Decision -->
        <div class="strategy-card" style="text-align:center;">
            <div class="section-title">🏁 Decisión Final</div>
            <p>Basado en los datos y la intuición, ¿cuál es el siguiente paso?</p>

            <div class="decision-buttons">
                <button class="btn-decision btn-pivot" onclick="recordDecision('PIVOT')">↻ PIVOTAR (Cambiar
                    Estrategia)</button>
                <button class="btn-decision btn-persevere" onclick="recordDecision('PERSEVERE')">➜ PERSEVERAR
                    (Optimizar)</button>
            </div>
            <p id="decision-status" style="margin-top:1rem; color:var(--success);"></p>
        </div>
    </div>

    <script src="js/plania-core.js"></script>
    <script src="js/moltbot_widget.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            calcRunway();
            document.getElementById('in-burn').addEventListener('input', calcRunway);
            document.getElementById('in-cash').addEventListener('input', calcRunway);
        });

        function calcRunway() {
            const burn = parseFloat(document.getElementById('in-burn').value) || 1;
            const cash = parseFloat(document.getElementById('in-cash').value) || 0;
            const months = (cash / burn).toFixed(1);

            document.getElementById('months-left').textContent = months;

            const alert = document.getElementById('runway-alert');
            if (months < 3) alert.textContent = "⚠️ ¡ALERTA ROJA! Queda muy poco tiempo. Se requiere un Pivote drástico o inyección de capital.";
            else if (months < 6) alert.textContent = "⚠️ Precaución. El tiempo apremia.";
            else alert.textContent = "✅ Pista saludable.";
        }

        function consultAI() {
            if (!window.Moltbot) { alert("IA no disponible"); return; }

            const learnings = document.getElementById('learnings').value;
            const months = document.getElementById('months-left').textContent;

            const prompt = `Actúa como Asesor de Startups (YCombinator style).
            
            Situación:
            - Runway: ${months} meses.
            - Aprendizajes recientes: "${learnings}"
            
            Analiza si debo PIVOTAR o PERSEVERAR.
            Si sugieres Pivotar, dime qué TIPO de pivote (Zoom-in, Zoom-out, Segmento, Tecnología, etc.) y por qué.
            
            Sé brutalmente honesto.`;

            window.Moltbot.toggle();
            window.Moltbot.send(prompt);
        }

        function recordDecision(type) {
            const msg = type === 'PIVOT'
                ? "Se ha registrado la decisión de PIVOTAR. Actualiza el Business Canvas."
                : "Se ha registrado la decisión de PERSEVERAR. Mide y optimiza.";

            document.getElementById('decision-status').textContent = msg;
            // Here we would save to DB history
        }
    </script>
</body>

</html>
