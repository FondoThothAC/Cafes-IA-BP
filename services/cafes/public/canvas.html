<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIA - Business Model Canvas</title>
    <link rel="stylesheet" href="css/plania-core.css?v=3">
    <style>
        .canvas-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, auto);
            gap: 0.5rem;
            min-height: 70vh;
        }

        .canvas-block {
            background: var(--surface);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .canvas-block:hover {
            border-color: var(--primary);
        }

        .canvas-block.partners {
            grid-column: 1;
            grid-row: 1 / 3;
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.15), rgba(139, 92, 246, 0.05));
            border-color: rgba(139, 92, 246, 0.3);
        }

        .canvas-block.activities {
            grid-column: 2;
            grid-row: 1;
            background: linear-gradient(180deg, rgba(236, 72, 153, 0.15), rgba(236, 72, 153, 0.05));
            border-color: rgba(236, 72, 153, 0.3);
        }

        .canvas-block.resources {
            grid-column: 2;
            grid-row: 2;
            background: linear-gradient(180deg, rgba(236, 72, 153, 0.15), rgba(236, 72, 153, 0.05));
            border-color: rgba(236, 72, 153, 0.3);
        }

        .canvas-block.value {
            grid-column: 3;
            grid-row: 1 / 3;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border-color: rgba(16, 185, 129, 0.3);
        }

        .canvas-block.relationships {
            grid-column: 4;
            grid-row: 1;
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.15), rgba(6, 182, 212, 0.05));
            border-color: rgba(6, 182, 212, 0.3);
        }

        .canvas-block.channels {
            grid-column: 4;
            grid-row: 2;
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.15), rgba(6, 182, 212, 0.05));
            border-color: rgba(6, 182, 212, 0.3);
        }

        .canvas-block.segments {
            grid-column: 5;
            grid-row: 1 / 3;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.15), rgba(37, 99, 235, 0.05));
            border-color: rgba(37, 99, 235, 0.3);
        }

        .canvas-block.costs {
            grid-column: 1 / 3;
            grid-row: 3;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05));
            border-color: rgba(245, 158, 11, 0.3);
        }

        .canvas-block.revenue {
            grid-column: 3 / 6;
            grid-row: 3;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border-color: rgba(16, 185, 129, 0.3);
        }

        .block-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .block-icon {
            font-size: 1.25rem;
        }

        .block-title {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .block-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .block-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .block-item input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.85rem;
            padding: 0;
        }

        .block-item input:focus {
            outline: none;
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .btn-remove-item:hover {
            opacity: 1;
            color: var(--error);
        }

        .btn-add-item {
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: auto;
        }

        .btn-add-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .project-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .canvas-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }

            .canvas-block {
                grid-column: auto !important;
                grid-row: auto !important;
            }
        }
    </style>
</head>

<body>
    <div id="plania-navbar"></div>

    <div class="page-container">
        <div class="actions-bar">
            <div>
                <h1 class="project-name" id="project-name">🎯 Business Model Canvas</h1>
                <p class="text-muted">Define los 9 bloques de tu modelo de negocio</p>
            </div>
            <div class="flex gap-1">
                <button class="btn btn-secondary" onclick="resetCanvas()">🔄 Reiniciar</button>
                <button class="btn btn-primary" onclick="saveCanvas()">💾 Guardar</button>
            </div>
        </div>

        <div class="canvas-grid" id="canvas">
            <!-- Partners -->
            <div class="canvas-block partners" data-block="partners">
                <div class="block-header">
                    <span class="block-icon">🤝</span>
                    <span class="block-title">Socios Clave</span>
                </div>
                <div class="block-content" id="partners-items"></div>
                <button class="btn-add-item" onclick="addItem('partners')">+ Agregar</button>
            </div>

            <!-- Activities -->
            <div class="canvas-block activities" data-block="activities">
                <div class="block-header">
                    <span class="block-icon">⚡</span>
                    <span class="block-title">Actividades Clave</span>
                </div>
                <div class="block-content" id="activities-items"></div>
                <button class="btn-add-item" onclick="addItem('activities')">+ Agregar</button>
            </div>

            <!-- Resources -->
            <div class="canvas-block resources" data-block="resources">
                <div class="block-header">
                    <span class="block-icon">🔧</span>
                    <span class="block-title">Recursos Clave</span>
                </div>
                <div class="block-content" id="resources-items"></div>
                <button class="btn-add-item" onclick="addItem('resources')">+ Agregar</button>
            </div>

            <!-- Value Proposition -->
            <div class="canvas-block value" data-block="value">
                <div class="block-header">
                    <span class="block-icon">💎</span>
                    <span class="block-title">Propuesta de Valor</span>
                </div>
                <div class="block-content" id="value-items"></div>
                <button class="btn-add-item" onclick="addItem('value')">+ Agregar</button>
            </div>

            <!-- Customer Relationships -->
            <div class="canvas-block relationships" data-block="relationships">
                <div class="block-header">
                    <span class="block-icon">💬</span>
                    <span class="block-title">Relación con Clientes</span>
                </div>
                <div class="block-content" id="relationships-items"></div>
                <button class="btn-add-item" onclick="addItem('relationships')">+ Agregar</button>
            </div>

            <!-- Channels -->
            <div class="canvas-block channels" data-block="channels">
                <div class="block-header">
                    <span class="block-icon">📦</span>
                    <span class="block-title">Canales</span>
                </div>
                <div class="block-content" id="channels-items"></div>
                <button class="btn-add-item" onclick="addItem('channels')">+ Agregar</button>
            </div>

            <!-- Customer Segments -->
            <div class="canvas-block segments" data-block="segments">
                <div class="block-header">
                    <span class="block-icon">👥</span>
                    <span class="block-title">Segmentos de Cliente</span>
                </div>
                <div class="block-content" id="segments-items"></div>
                <button class="btn-add-item" onclick="addItem('segments')">+ Agregar</button>
            </div>

            <!-- Cost Structure -->
            <div class="canvas-block costs" data-block="costs">
                <div class="block-header">
                    <span class="block-icon">💸</span>
                    <span class="block-title">Estructura de Costos</span>
                </div>
                <div class="block-content" id="costs-items"></div>
                <button class="btn-add-item" onclick="addItem('costs')">+ Agregar</button>
            </div>

            <!-- Revenue Streams -->
            <div class="canvas-block revenue" data-block="revenue">
                <div class="block-header">
                    <span class="block-icon">💰</span>
                    <span class="block-title">Fuentes de Ingresos</span>
                </div>
                <div class="block-content" id="revenue-items"></div>
                <button class="btn-add-item" onclick="addItem('revenue')">+ Agregar</button>
            </div>
        </div>

        <footer class="footer">© 2026 Fondo Thoth AC</footer>
    </div>

    <script src="js/plania-core.js"></script>
    <script>
        let canvasData = {
            partners: [], activities: [], resources: [], value: [],
            relationships: [], channels: [], segments: [], costs: [], revenue: []
        };

        window.addEventListener('plania:projectChanged', loadCanvas);
        window.addEventListener('DOMContentLoaded', () => setTimeout(loadCanvas, 500));

        async function loadCanvas() {
            const project = PlanIA.getCurrentProject();
            if (!project) return;

            document.getElementById('project-name').textContent = `🎯 ${project.a1_nombre_negocio || 'Canvas'}`;

            // Try to parse existing canvas data from c4_organigrama_json (reusing field)
            try {
                const parsed = JSON.parse(project.c4_organigrama_json || '{}');
                if (parsed.canvas) canvasData = parsed.canvas;
            } catch (e) { }

            // Pre-fill from project data if empty
            if (canvasData.value.length === 0 && project.b3_propuesta_valor) {
                canvasData.value.push(project.b3_propuesta_valor);
            }
            if (canvasData.segments.length === 0 && project.d1_segmento_cliente) {
                canvasData.segments.push(project.d1_segmento_cliente);
            }

            renderAllBlocks();
        }

        function renderAllBlocks() {
            Object.keys(canvasData).forEach(block => {
                const container = document.getElementById(`${block}-items`);
                if (!container) return;

                container.innerHTML = canvasData[block].map((item, idx) => `
                    <div class="block-item">
                        <input type="text" value="${item}" onchange="updateItem('${block}', ${idx}, this.value)">
                        <button class="btn-remove-item" onclick="removeItem('${block}', ${idx})">✕</button>
                    </div>
                `).join('');
            });
        }

        function addItem(block) {
            canvasData[block].push('');
            renderAllBlocks();
            // Focus new input
            const container = document.getElementById(`${block}-items`);
            const inputs = container.querySelectorAll('input');
            if (inputs.length > 0) inputs[inputs.length - 1].focus();
        }

        function updateItem(block, index, value) {
            canvasData[block][index] = value;
        }

        function removeItem(block, index) {
            canvasData[block].splice(index, 1);
            renderAllBlocks();
        }

        function resetCanvas() {
            if (!confirm('¿Reiniciar el canvas? Se perderán todos los cambios.')) return;
            canvasData = {
                partners: [], activities: [], resources: [], value: [],
                relationships: [], channels: [], segments: [], costs: [], revenue: []
            };
            renderAllBlocks();
        }

        async function saveCanvas() {
            const project = PlanIA.getCurrentProject();
            if (!project) {
                alert('Selecciona un proyecto primero');
                return;
            }

            // Show saving indicator
            const saveBtn = document.querySelector('.btn-primary');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = '⏳ Guardando...';
            saveBtn.disabled = true;

            // Clean empty items
            Object.keys(canvasData).forEach(block => {
                canvasData[block] = canvasData[block].filter(item => item.trim());
            });

            try {
                // Merge with existing data (keep roles if they exist)
                let existingData = {};
                try {
                    existingData = JSON.parse(project.c4_organigrama_json || '{}');
                } catch (e) { }

                const mergedData = {
                    ...existingData,
                    canvas: canvasData
                };

                const res = await fetch(PlanIA.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update',
                        id_proyecto: project.id_proyecto,
                        c4_organigrama_json: JSON.stringify(mergedData)
                    })
                });
                const result = await res.json();

                saveBtn.textContent = originalText;
                saveBtn.disabled = false;

                if (result.success) {
                    // Update local project data
                    project.c4_organigrama_json = JSON.stringify(mergedData);
                    saveBtn.textContent = '✅ Guardado';
                    setTimeout(() => { saveBtn.textContent = originalText; }, 2000);
                } else {
                    alert('Error: ' + (result.error || 'No se pudo guardar'));
                }
            } catch (err) {
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
                alert('Error de conexión: ' + err.message);
            }
        }
    </script>
</body>

</html>
