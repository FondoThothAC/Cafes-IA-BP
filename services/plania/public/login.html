<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIA - Iniciar Sesión</title>
    <!-- CSS Dependencies -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }

        .login-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-dark {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        .input-dark:focus {
            border-color: #a855f7;
            ring: 2px solid rgba(168, 85, 247, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>

<body class="h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600 opacity-10 blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600 opacity-10 blur-[100px]">
        </div>
    </div>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md px-6">
        <div class="text-center mb-8">
            <h1
                class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
                PlanIA
            </h1>
            <h2 class="text-xl text-gray-400">Plataforma de Inteligencia de Negocios</h2>
        </div>

        <div class="login-card rounded-2xl p-8">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-400 mb-2">Usuario</label>
                    <input type="text" id="username" class="input-dark w-full px-4 py-3 rounded-xl"
                        placeholder="admin / asesor" required>
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-400 mb-2">Contraseña</label>
                    <input type="password" id="password" class="input-dark w-full px-4 py-3 rounded-xl"
                        placeholder="••••••••" required>
                </div>

                <div id="errorMessage" class="mb-4 text-red-400 text-sm text-center hidden">
                    Credenciales incorrectas
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold text-white shadow-lg">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500">
                © 2026 Fondo Thoth AC | Acceso restringido
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('errorMessage');

            // Loading state
            btn.innerHTML = 'Verificando...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                // Call Auth API (PHP)
                const response = await fetch('api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (data.success) {
                    // Store Session
                    localStorage.setItem('plania_session', JSON.stringify(data.session));

                    // Redirect based on role
                    if (data.session.role === 'admin') {
                        window.location.href = 'admin_console.html';
                    } else {
                        window.location.href = 'index.html'; // Or dashboard
                    }
                } else {
                    throw new Error(data.error || 'Error de acceso');
                }

            } catch (error) {
                console.error(error);
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
                btn.innerHTML = 'Ingresar al Sistema';
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
