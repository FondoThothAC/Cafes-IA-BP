<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIA - Seleccionar Usuario</title>
    <!-- CSS Dependencies -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }

        .login-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-dark {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        .input-dark:focus {
            border-color: #a855f7;
            ring: 2px solid rgba(168, 85, 247, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(168, 85, 247, 0.4);
        }
        
        .dev-notice {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid rgba(234, 179, 8, 0.5);
            color: #fcd34d;
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body class="h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600 opacity-10 blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600 opacity-10 blur-[100px]">
        </div>
    </div>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md px-6">
        <div class="text-center mb-8">
            <h1
                class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
                PlanIA
            </h1>
            <h2 class="text-xl text-gray-400">Plataforma de Inteligencia de Negocios</h2>
        </div>

        <div class="login-card rounded-2xl p-8">
            <div class="dev-notice text-center">
                ⚠️ Modo Desarrollo - Autenticación Deshabilitada
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-400 mb-2">Selecciona tu Usuario</label>
                    <select id="username" class="input-dark w-full px-4 py-3 rounded-xl" required>
                        <option value="">-- Elige un usuario --</option>
                        <optgroup label="Administradores">
                            <option value="celis">Celis (Admin)</option>
                            <option value="segura">Segura (Admin)</option>
                            <option value="castillo">Castillo (Admin)</option>
                        </optgroup>
                        <optgroup label="Asesores">
                            <option value="yaretzy">Yaretzy (Asesor)</option>
                            <option value="edwin">Edwin (Asesor)</option>
                            <option value="darinka">Darinka (Asesor)</option>
                            <option value="heidi">Heidi (Asesor)</option>
                            <option value="angel">Angel (Asesor)</option>
                            <option value="nico">Nico (Asesor)</option>
                        </optgroup>
                    </select>
                </div>

                <div id="errorMessage" class="mb-4 text-red-400 text-sm text-center hidden">
                    Selecciona un usuario
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold text-white shadow-lg">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500">
                © 2026 Fondo Thoth AC | Modo Desarrollo
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('errorMessage');

            if (!user) {
                errorMsg.textContent = 'Selecciona un usuario';
                errorMsg.classList.remove('hidden');
                return;
            }

            // Loading state
            btn.innerHTML = 'Ingresando...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            // Determine role from dropdown value
            const adminUsers = ['celis', 'segura', 'castillo'];
            const role = adminUsers.includes(user) ? 'admin' : 'asesor';

            // Mock session (no authentication)
            const session = {
                token: 'dev_mode_' + Date.now(),
                user_id: 0,
                username: user,
                role: role,
                full_name: user.charAt(0).toUpperCase() + user.slice(1),
                login_at: new Date().toISOString()
            };

            // Store Session
            localStorage.setItem('plania_session', JSON.stringify(session));
            localStorage.setItem('uuid_usuario', session.username);
            localStorage.setItem('user_role', session.role);

            // Redirect based on role
            if (role === 'admin') {
                window.location.href = 'admin_console.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
